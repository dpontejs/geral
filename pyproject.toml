[project]
name = "resenha"
version = "0.1.0"
description = "Hub de newsletters de futebol brasileiro, uma por time"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "feedparser",
    "google-genai",
    "httpx",
    "jinja2",
    "premailer",
    "pydantic",
    "pydantic-settings",
    "python-dateutil",
    "python-multipart>=0.0.32",
    "rapidfuzz",
    "rich>=15.0.0",
    "selectolax",
    "tenacity",
    "trafilatura",
    "typer",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "freezegun",
    "pytest",
    "respx",
    "ruff",
]

[project.scripts]
resenha = "resenha.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["resenha"]
