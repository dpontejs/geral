# Escolhas da Carreira: perguntas que aparecem entre temporadas, conforme a condição.
# {nome}, {clube}, {idade} e {destino} (o clube que a primeira opção com destino propõe),
# {outro} é o segundo clube oferecido (e {pais_destino}, {pais_outro}); numa opção, {destino} é o
# clube daquela opção. Também com artigo que concorda com o gênero do clube: {o_destino}, {do_clube}, {para_o_destino}…
# destino: ficar, europa, maior, emprestimo, arabia, casa, aposentar, mais_um.
# Nunca reuse um id: carreiras compartilhadas guardam a ordem das respostas.

[[escolha]]
id = "proposta-europa"
pergunta = "{O_destino} quer {nome}, de {idade} anos. E agora?"
peso = 3
condicao = { idade_min = 19, idade_max = 28, nota_min = 66, forca_max = 79 }
[[escolha.opcao]]
texto = "Aceitar e ir {para_o_destino}"
destino = "europa"
[[escolha.opcao]]
texto = "Ficar e virar ídolo {no_clube}"
destino = "ficar"

[[escolha]]
id = "emprestimo-ou-banco"
pergunta = "Pouco espaço {no_clube}. {O_destino} pede {nome} emprestado por um ano."
peso = 2
condicao = { idade_min = 18, idade_max = 23, jogos_max = 15 }
[[escolha.opcao]]
texto = "Ir emprestado {para_o_destino} para jogar"
destino = "emprestimo"
[[escolha.opcao]]
texto = "Ficar e brigar por posição"
destino = "ficar"

[[escolha]]
id = "proposta-maior"
pergunta = "{O_destino} faz uma proposta alta por {nome}."
peso = 2
condicao = { idade_min = 20, idade_max = 30, nota_min = 58 }
[[escolha.opcao]]
texto = "Dar o salto {para_o_destino}"
destino = "maior"
[[escolha.opcao]]
texto = "Recusar e seguir {no_clube}"
destino = "ficar"

[[escolha]]
id = "proposta-arabia"
pergunta = "Os petrodólares {do_destino} batem à porta de {nome}, {idade} anos."
peso = 1.5
condicao = { idade_min = 28, idade_max = 34, nota_min = 68 }
[[escolha.opcao]]
texto = "Topar e ir {para_o_destino}"
destino = "arabia"
[[escolha.opcao]]
texto = "Seguir {no_clube}"
destino = "ficar"

[[escolha]]
id = "voltar-para-casa"
pergunta = "A torcida {do_destino} pede a volta de {nome}."
peso = 2
condicao = { idade_min = 30, idade_max = 36, no_clube_inicial = false }
[[escolha.opcao]]
texto = "Voltar {para_o_destino}"
destino = "casa"
[[escolha.opcao]]
texto = "Ficar {no_clube}"
destino = "ficar"

[[escolha]]
id = "parar-ou-mais-um"
pergunta = "{nome} tem {idade} anos e o corpo começa a cobrar."
peso = 3
condicao = { idade_min = 33, idade_max = 39 }
[[escolha.opcao]]
texto = "Pendurar as chuteiras"
destino = "aposentar"
[[escolha.opcao]]
texto = "Mais um ano"
destino = "mais_um"

[[escolha]]
id = "volta-por-cima"
pergunta = "{nome} volta de lesão grave. {O_destino} oferece minutos para recuperar o ritmo."
peso = 4
condicao = { idade_min = 19, idade_max = 33, requer = ["lesao-grave"] }
[[escolha.opcao]]
texto = "Ir {para_o_destino} jogar"
destino = "emprestimo"
[[escolha.opcao]]
texto = "Recuperar {no_clube}"
destino = "ficar"

[[escolha]]
id = "promessa-cedo"
pergunta = "Aos {idade}, {nome} recebe sondagem {do_destino}."
peso = 2
condicao = { idade_min = 17, idade_max = 19, nota_min = 52 }
[[escolha.opcao]]
texto = "Embarcar cedo {para_o_destino}"
destino = "europa"
[[escolha.opcao]]
texto = "Amadurecer {no_clube}"
destino = "ficar"

[[escolha]]
id = "fim-de-contrato"
pergunta = "O contrato de {nome} com {o_clube} acaba. Tem proposta {do_destino} e {do_outro} ({pais_outro})."
peso = 2
condicao = { idade_min = 24, idade_max = 32 }
[[escolha.opcao]]
texto = "Assinar com {o_destino}"
destino = "maior"
[[escolha.opcao]]
texto = "Topar a aventura {no_destino} ({pais_destino})"
destino = "exotico"
[[escolha.opcao]]
texto = "Renovar com {o_clube}"
destino = "ficar"

[[escolha]]
id = "reserva-na-europa"
pergunta = "{nome} perdeu espaço {no_clube}. {O_destino} pede o empréstimo."
peso = 3
condicao = { forca_min = 80, jogos_max = 18, idade_max = 31 }
[[escolha.opcao]]
texto = "Ir emprestado {para_o_destino}"
destino = "emprestimo"
[[escolha.opcao]]
texto = "Ficar e lutar pela vaga"
destino = "ficar"

[[escolha]]
id = "capitao-ou-dinheiro"
pergunta = "Capitão {do_clube}, {nome} recebe uma oferta milionária {do_destino}."
peso = 2
condicao = { idade_min = 26, idade_max = 32, nota_min = 70, requer = ["capitao"] }
[[escolha.opcao]]
texto = "Aceitar o dinheiro {do_destino}"
destino = "arabia"
[[escolha.opcao]]
texto = "Seguir capitão {do_clube}"
destino = "ficar"

[[escolha]]
id = "aventura-no-fim"
pergunta = "Aos {idade}, {nome} pode encerrar a carreira longe: {o_destino} quer ele."
peso = 2
condicao = { idade_min = 31, idade_max = 36 }
[[escolha.opcao]]
texto = "Viver a aventura {no_destino}"
destino = "exotico"
[[escolha.opcao]]
texto = "Ficar {no_clube}"
destino = "ficar"

[[escolha]]
id = "parar-cedo"
pergunta = "Aos {idade}, sem espaço, {nome} pensa em parar."
peso = 3
condicao = { idade_min = 30, idade_max = 33, nota_max = 56 }
[[escolha.opcao]]
texto = "Parar e abrir uma escolinha"
destino = "aposentar"
[[escolha.opcao]]
texto = "Insistir mais um ano"
destino = "mais_um"

[[escolha]]
id = "ultima-danca"
pergunta = "{nome}, {idade} anos, decide como será o fim."
peso = 2
condicao = { idade_min = 34, idade_max = 38, no_clube_inicial = false }
[[escolha.opcao]]
texto = "Se despedir {no_destino}, onde tudo começou"
destino = "casa"
[[escolha.opcao]]
texto = "Parar agora, no auge possível"
destino = "aposentar"
[[escolha.opcao]]
texto = "Mais um ano {no_clube}"
destino = "mais_um"

[[escolha]]
id = "salario-atrasado"
pergunta = "Com salários atrasados {no_clube}, {o_destino} oferece uma saída a {nome}."
peso = 4
condicao = { requer = ["crise-do-clube"], idade_max = 34 }
[[escolha.opcao]]
texto = "Sair {para_o_destino}"
destino = "menor"
[[escolha.opcao]]
texto = "Ficar e ajudar {o_clube}"
destino = "ficar"

[[escolha]]
id = "rival-chama"
pergunta = "{O_destino} quer tirar {nome} {do_clube}. A torcida não vai perdoar."
peso = 2
condicao = { idade_min = 21, idade_max = 31, nota_min = 62, forca_max = 79 }
[[escolha.opcao]]
texto = "Atravessar a rua e ir {para_o_destino}"
destino = "maior"
[[escolha.opcao]]
texto = "Recusar: aqui é casa"
destino = "ficar"

# Decisões fora do mercado (destino "ficar"): o resultado pode gravar uma marca.
# chance / bonus / sucesso / fracasso como no dia a dia; marca (deu certo) e marca_fracasso.
# continua = true: passo de um arco. Vem obrigatoriamente no inverno seguinte à marca que ele
# requer; nunca sai no sorteio.

[[escolha]]
id = "tecnico-barra"
pergunta = "O técnico {do_clube} tira {nome} do time titular sem dar explicação."
peso = 2
condicao = { idade_min = 20, idade_max = 32, exclui = ["brigou-com-tecnico"] }
[[escolha.opcao]]
texto = "Treinar calado e esperar a chance"
chance = 65
bonus = "fisico"
sucesso = { nota = 1 }
fracasso = { jogos = 0.8 }
[[escolha.opcao]]
texto = "Cobrar o técnico na frente do grupo"
marca = "brigou-com-tecnico"
sucesso = { saida = 0.3 }
[[escolha.opcao]]
texto = "Desafiar o técnico: \"me põe no clássico e eu decido\""
chance = 22
bonus = "lideranca"
sucesso = { nota = 3, teto = 3 }
fracasso = { nota = -2, saida = 0.3 }
marca_fracasso = "brigou-com-tecnico"

[[escolha]]
id = "fim-da-fila"
pergunta = "Depois da briga, {nome} vai para o fim da fila {no_clube}. O técnico nem olha para ele."
continua = true
condicao = { requer = ["brigou-com-tecnico"], idade_max = 35 }
[[escolha.opcao]]
texto = "Pedir desculpas em público"
chance = 55
bonus = "lideranca"
sucesso = { nota = 2 }
fracasso = { nota = -1, saida = 0.3 }
[[escolha.opcao]]
texto = "Forçar a saída"
marca = "polemico"
sucesso = { saida = 0.7 }

[[escolha]]
id = "bracadeira-oferecida"
pergunta = "O técnico oferece a braçadeira {do_clube} a {nome}, {idade} anos."
peso = 1.5
condicao = { idade_min = 23, idade_max = 33, nota_min = 64, exclui = ["bracadeira", "capitao"] }
[[escolha.opcao]]
texto = "Aceitar e vestir a braçadeira"
marca = "bracadeira"
[[escolha.opcao]]
texto = "Recusar: prefere só jogar"

[[escolha]]
id = "crise-no-vestiario"
pergunta = "Derrotas seguidas e o vestiário {do_clube} racha. Todos olham para o capitão {nome}."
continua = true
condicao = { requer = ["bracadeira"], idade_max = 36 }
[[escolha.opcao]]
texto = "Reunir o grupo e assumir a culpa"
chance = 55
bonus = "lideranca"
marca = "lider-do-vestiario"
fracasso = { nota = -1 }
[[escolha.opcao]]
texto = "Ficar na sua e deixar o técnico resolver"
sucesso = { nota = -1, saida = 0.2 }
[[escolha.opcao]]
texto = "Dar uma coletiva e chamar a torcida para a briga"
chance = 20
bonus = "lideranca"
sucesso = { nota = 3, teto = 2 }
marca = "lider-do-vestiario"
fracasso = { nota = -3, saida = 0.3 }
marca_fracasso = "polemico"

[[escolha]]
id = "teste-no-meio"
pergunta = "O técnico {do_clube} quer testar {nome} no meio-campo."
peso = 1.5
condicao = { idade_min = 20, idade_max = 29, posicoes = ["atacante", "volante", "lateral"] }
[[escolha.opcao]]
texto = "Topar e aprender a posição"
chance = 60
bonus = "passe"
marca = "virou-meia"
fracasso = { nota = -2 }
[[escolha.opcao]]
texto = "Pedir para seguir onde sempre jogou"

[[escolha]]
id = "feriado-com-os-amigos"
pergunta = "Os amigos de infância chamam {nome} para três dias de festa no feriado."
peso = 1.5
condicao = { idade_min = 18, idade_max = 30, exclui = ["baladeiro"] }
[[escolha.opcao]]
texto = "Ir e curtir sem culpa"
chance = 45
sucesso = { atributos = { lideranca = 1 } }
fracasso = { nota = -3 }
marca_fracasso = "baladeiro"
[[escolha.opcao]]
texto = "Ficar em casa e descansar"
sucesso = { atributos = { fisico = 1 } }

[[escolha]]
id = "beijar-o-escudo"
pergunta = "A torcida {do_clube} pede que {nome} jure ficar para sempre."
peso = 1.5
condicao = { idade_min = 22, idade_max = 30, no_clube_inicial = true, exclui = ["idolo-de-um-clube"] }
[[escolha.opcao]]
texto = "Beijar o escudo e renovar até o fim da carreira"
marca = "idolo-de-um-clube"
sucesso = { saida = -0.6 }
[[escolha.opcao]]
texto = "Desconversar: no futebol nada é para sempre"
