# Escolhas da Carreira: perguntas que aparecem entre temporadas, conforme a condição.
# {nome}, {clube}, {idade} e {destino} (o clube que a primeira opção com destino propõe),
# {outro} é o segundo clube oferecido (e {pais_destino}, {pais_outro}); numa opção, {destino} é o
# clube daquela opção. Também com artigo que concorda com o gênero do clube: {o_destino}, {do_clube}, {para_o_destino}…
# destino: ficar, europa, maior, emprestimo, arabia, casa, aposentar, mais_um.
# Nunca reuse um id: carreiras compartilhadas guardam a ordem das respostas.

[[escolha]]
id = "proposta-europa"
pergunta = "{O_destino} quer {nome}, de {idade} anos. E agora?"
peso = 3
condicao = { idade_min = 19, idade_max = 28, nota_min = 66, forca_max = 79, exclui = ["idolo-de-um-clube"] }
[[escolha.opcao]]
texto = "Aceitar e ir {para_o_destino}"
destino = "europa"
[[escolha.opcao]]
texto = "Ficar e virar ídolo {no_clube}"
destino = "ficar"

[[escolha]]
id = "emprestimo-ou-banco"
