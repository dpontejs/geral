[[marca]]
id = "xodo-da-torcida"
nome = "Xodó da torcida"
texto = "{nome} vira o xodó da arquibancada"
efeito = { saida = -0.2 }

[[marca]]
id = "recusou-a-selecao"
nome = "Recusou a Seleção"
