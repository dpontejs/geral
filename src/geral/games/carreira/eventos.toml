# Eventos da Carreira: o que pode acontecer numa temporada, com manchete de jornal.
# momento "antes" vem antes dos números da temporada (pode tirar jogos: efeito.jogos);
# "depois" pode exigir gols, jogos ou título. Campos das manchetes: {nome}, {clube},
# {liga}, {campeonato}, {gols}, {jogos}, {idade}, {camisa}. O clube com artigo, que concorda
# com o gênero do clube (a Lazio): {o_clube}, {O_clube}, {do_clube}, {no_clube}, {pelo_clube},
# {ao_clube}, {para_o_clube}. Nunca reuse um id.

[[evento]]
id = "temporada-comum"
peso = 0.5
unico = false
condicao = { idade_min = 17 }
manchetes = [
  "{nome} cumpre mais uma temporada {pelo_clube}",
  "Ano discreto de {nome} {no_clube}",
  "{nome} segue no elenco {do_clube}",
]

