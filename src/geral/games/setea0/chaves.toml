# 7a0 do clube: os adversários de cada edição (docs/features/setea0.md).
# `adversarios`: os 6 jogos antes da final, do mais fraco ao mais forte; `final`: o clássico.
# `publicado`: o dev liga depois de revisar a lista e os ídolos do clube (elencos/, idolos.toml).
# `[clube.*]`: de onde vem o elenco; `velha` = base do jogo da velha (todos os tempos, sem
# décadas), `ptwiki` = categoria da Wikipédia em português (com os anos no clube).

[edicao.abc]
nome = "ABC"
adversarios = ["ceara", "fortaleza", "santa-cruz", "vitoria", "sport", "bahia"]
final = "america-rn"
publicado = false

[edicao.nautico]
nome = "Náutico"
adversarios = ["abc", "ceara", "fortaleza", "santa-cruz", "vitoria", "bahia"]
final = "sport"
publicado = false

[edicao.csa]
