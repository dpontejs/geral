# Team catalog. A new team is a new entry here: check `espn_id` on
# https://site.api.espn.com/apis/site/v2/sports/soccer/<league>/teams and `ge_url` in the browser.
# `leagues` are the ESPN league codes tracked (names in geral.teams.LEAGUES); `league` is the
# one whose table, campaign and rankings go in the e-mail (none when ESPN has no table). `accent` must read well on white and under white text.

[vasco]
sender = "almirante"
name = "Vasco"
newsletter = "Almirante News"
fans = "vascaínos"
espn_id = 3454
ge_url = "https://ge.globo.com/futebol/times/vasco/"
news_query = '"Vasco" futebol'
keywords = ["vasco", "vascaíno", "vascaínos", "cruzmaltino", "gigante da colina"]
accent = "#141414"
leagues = ["bra.1", "conmebol.sudamericana", "bra.copa_do_brazil", "bra.camp.carioca"]
league = "bra.1"
[vasco.other_sports]
"Futebol feminino" = '"Vasco" futebol feminino'
"Basquete" = '"Vasco" basquete OR NBB'

[palmeiras]
sender = "porco"
name = "Palmeiras"
newsletter = "Porco News"
fans = "palmeirenses"
espn_id = 2029
ge_url = "https://ge.globo.com/futebol/times/palmeiras/"
news_query = '"Palmeiras" futebol'
keywords = ["palmeiras", "verdão", "palmeirense", "palmeirenses", "alviverde"]
accent = "#006437"
leagues = ["bra.1", "conmebol.libertadores", "bra.copa_do_brazil", "bra.camp.paulista"]
league = "bra.1"
[palmeiras.other_sports]
"Futebol feminino" = '"Palmeiras" futebol feminino'

[abc]
sender = "elefante"
name = "ABC"
newsletter = "Elefante News"
fans = "abecedistas"
espn_id = 9965
ge_url = "https://ge.globo.com/rn/futebol/times/abc/"
news_query = '"ABC" futebol Natal'
keywords = ["abc", "abecedista", "abecedistas", "alvinegro potiguar"]
accent = "#141414"
# Série D 2026, promoted to Série C 2027. ESPN covers neither nor the Potiguar: those matches,
# the table and the form come from ge's table API (docs/features/dados-serie-c.md).
leagues = ["bra.copa_do_nordeste", "bra.copa_do_brazil"]
ge_id = 350
cbf_id = 20042
[abc.ge_tables]
"Série C" = "https://ge.globo.com/futebol/brasileirao-serie-c/"
# Série D 2026: the last matches (form, last game) until the 2027 season; drop it then.
"Série D" = "https://ge.globo.com/futebol/brasileirao-serie-d/"
"Potiguar" = "https://ge.globo.com/rn/futebol/campeonato-potiguar/"
[abc.cbf_tables]  # goal scorers; the Potiguar is not on the CBF site
"Série C" = "campeonato-brasileiro/serie-c"
"Série D" = "campeonato-brasileiro/serie-d"

[nautico]
sender = "timbu"
name = "Náutico"
newsletter = "Timbu News"
fans = "alvirrubros"
espn_id = 7633
ge_url = "https://ge.globo.com/pe/futebol/times/nautico/"
news_query = '"Náutico" futebol'
keywords = ["náutico", "nautico", "timbu", "alvirrubro", "alvirrubros"]
accent = "#C60000"
leagues = ["bra.2", "bra.copa_do_nordeste", "bra.copa_do_brazil"]
league = "bra.2"
# ESPN has no Pernambucano; the Náutico joins it in the second stage (Frevo).
ge_id = 343
[nautico.ge_tables]
"Pernambucano" = "https://ge.globo.com/pe/futebol/campeonato-pernambucano/"

# The Urubu News, moved in from its own app (docs/adr/0001, docs/features/urubu-na-geral.md):
# its subscribers, bolão and old links live in the Geral since the switch.
[flamengo]
sender = "news"
name = "Flamengo"
newsletter = "Urubu News"
fans = "rubro-negros"
espn_id = 819
ge_url = "https://ge.globo.com/futebol/times/flamengo/"
news_query = "Flamengo futebol"
keywords = ["flamengo", "fla", "mengão", "rubro-negro", "rubro-negra", "rubro-negros"]
accent = "#A51C24"
leagues = ["bra.1", "conmebol.libertadores", "bra.copa_do_brazil", "bra.camp.carioca", "bra.supercopa_do_brazil", "fifa.cwc"]
league = "bra.1"
listed = true
[flamengo.other_sports]
"Basquete" = '"Flamengo" basquete OR NBB'
"Vôlei" = '"Sesc-Flamengo" OR "Flamengo" vôlei'
"Futebol feminino" = '"Flamengo" futebol feminino'
