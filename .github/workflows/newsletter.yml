name: Newsletter

on:
  # The VPS (infra: geral-trigger timer) asks the page every 10 minutes which team editions are due
  # and dispatches each one once; this hourly cron is the backup (`auto` + --skip-if-sent, for every
  # team: a team nobody follows stops before collecting news). Odd minute: GitHub drops runs on the hour.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      team:
        description: "Torcida (slug do teams.toml, ex.: vasco)"
        type: string
        required: true
      edition:
        description: "Edição (auto = a que a agenda dos jogos manda agora)"
        type: choice
        options: [auto, pre, post, news]
        default: auto
      date:
        description: "Data de referência (AAAA-MM-DD, opcional)"
        type: string
        required: false
      dry_run:
        description: "Só simular (não envia e-mail)"
        type: boolean
        default: true
      skip_if_sent:
        description: "Não enviar se a edição já saiu (disparo automático)"
        type: boolean
        default: false
      note:
        description: "Aviso no quadro \"Novidades\" (opcional; o assunto ganha \"Novidades!\")"
        type: string
        required: false
      publish_only:
        description: "Só publicar no portal (primeira edição de uma torcida; não envia e-mail)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  teams:
    name: Teams to run
    runs-on: ubuntu-latest
    outputs:
      teams: ${{ steps.list.outputs.teams }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Manual/VPS runs: the requested team. Scheduled backup: every team in the catalog.
      - name: List teams
        id: list
        env:
          TEAM: ${{ inputs.team }}
        run: |
          if [ -n "$TEAM" ]; then
            echo "teams=[\"$TEAM\"]" >> "$GITHUB_OUTPUT"
          else
            python3 -c 'import json, tomllib; print("teams=" + json.dumps(list(tomllib.load(open("src/geral/teams.toml", "rb")))))' >> "$GITHUB_OUTPUT"
          fi

  send:
    name: Build and send (${{ matrix.team }})
    needs: teams
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        team: ${{ fromJSON(needs.teams.outputs.teams) }}
    # Never let two runs send the same team's edition in parallel.
    concurrency:
      group: newsletter-${{ matrix.team }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build and send
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
          SUBSCRIBERS_API_TOKEN: ${{ secrets.SUBSCRIBERS_API_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://geral.diegoponte.dev' }}
          # Scheduled runs send for real; manual runs default to a dry run.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run && 'true' || 'false') }}
          TEAM: ${{ matrix.team }}
          EDITION: ${{ inputs.edition || 'auto' }}
          REFERENCE_DATE: ${{ inputs.date }}
          NOTE: ${{ inputs.note }}
          PUBLISH_ONLY: ${{ inputs.publish_only && 'true' || 'false' }}
          SKIP_IF_SENT: ${{ github.event_name == 'schedule' && 'true' || (inputs.skip_if_sent && 'true' || 'false') }}
        run: |
          args=(--team "$TEAM" --edition "$EDITION")
          if [ "$SKIP_IF_SENT" = "true" ]; then args+=(--skip-if-sent); fi
          if [ -n "$REFERENCE_DATE" ]; then args+=(--date "$REFERENCE_DATE"); fi
          if [ -n "$NOTE" ]; then args+=(--note "$NOTE"); fi
          if [ "$PUBLISH_ONLY" = "true" ]; then args+=(--publish-only); fi
          echo "DRY_RUN=$DRY_RUN SKIP_IF_SENT=$SKIP_IF_SENT PUBLISH_ONLY=$PUBLISH_ONLY team=$TEAM edition=$EDITION date=${REFERENCE_DATE:-hoje}"
          uv run python -m geral run "${args[@]}"

      - name: Upload rendered newsletter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ matrix.team }}-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30
