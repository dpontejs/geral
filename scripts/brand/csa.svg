<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <!-- Azulão (Cyanoloxia brissonii), esports mascot style: CSA blue and white, #1C1C1C ink. -->
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="227"/></clipPath>
  </defs>
  <pattern id="chk" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#FFFFFF"/><rect width="16" height="16" fill="#D8D8D8"/><rect x="16" y="16" width="16" height="16" fill="#D8D8D8"/></pattern>
  <rect width="512" height="512" fill="url(#chk)"/>
  <circle cx="256" cy="256" r="250" fill="#1B4B9B"/>
  <circle cx="256" cy="256" r="237" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="229" fill="#1B4B9B"/>
  <g clip-path="url(#disc)" stroke="#1C1C1C" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- shoulders: dark wing feathers with a white edge -->
    <path d="M40 520 L70 420 L52 424 L96 350 L78 350 L132 300 L118 296 L176 270 L250 330 L280 520 Z" fill="#0E2F6B"/>
    <path d="M96 520 L112 460 L100 462 L130 410 L118 410 L156 372 L196 420 L200 520 Z" fill="#3D7BDB" stroke-width="7"/>
    <path d="M472 520 L446 430 L462 432 L420 370 L436 368 L380 330 L300 360 L290 520 Z" fill="#0E2F6B"/>
    <!-- chest: white feathers -->
    <path d="M196 520 L204 420 L188 424 L222 360 L206 356 L250 324 L330 324 L366 352 L350 356 L380 404 L362 404 L384 460 L366 458 L376 520 Z" fill="#FFFFFF"/>
    <path d="M250 430 L262 400 L274 430 M300 410 L312 380 L324 410 M270 480 L282 452 L294 480" fill="none" stroke-width="6"/>
    <!-- head, crest swept back -->
    <path d="M160 268
             L108 236 L152 226 L104 178 L160 184 L132 126 L190 156 L196 96 L236 146 L262 98 L276 150
             C 322 138 368 158 384 206
             C 398 250 384 300 350 326
             C 312 354 244 356 206 330
             C 184 314 168 294 160 268 Z" fill="#0E2F6B"/>
    <!-- bright blue brow stripe and crown, the male's shine -->
    <path d="M226 168 L262 120 L272 160 C 316 150 356 166 376 200 L 348 204 C 322 186 288 184 262 196 Z" fill="#3D7BDB" stroke-width="6"/>
    <!-- bright cheek feathers -->
    <path d="M232 276 L 262 266 L 254 284 L 290 276 L 280 296 L 322 288 L 344 300 C 312 324 258 322 226 302 Z" fill="#3D7BDB" stroke-width="6"/>
    <!-- beak: thick seed-cracker cone, open -->
    <path d="M336 196 C 378 192 432 208 470 240 C 428 246 382 248 342 250 Z" fill="#1C1C1C"/>
    <path d="M342 262 C 380 262 418 266 446 272 C 420 300 380 314 344 306 Z" fill="#1C1C1C"/>
    <path d="M342 250 L 470 240 L 446 272 L 342 262 Z" fill="#F4EFE6" stroke-width="6"/>
    <path d="M362 208 C 394 212 422 222 446 236" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <!-- eye: white, pupil up front, cut by the angry brow -->
    <path d="M266 226 C 286 212 322 214 340 236 C 318 256 282 252 266 226 Z" fill="#FFFFFF" stroke-width="6"/>
    <circle cx="320" cy="236" r="11" fill="#1C1C1C" stroke="none"/>
    <circle cx="324" cy="232" r="3.5" fill="#FFFFFF" stroke="none"/>
    <path d="M236 184 L 360 228 L 344 240 C 318 222 292 214 258 216 Z" fill="#1C1C1C" stroke-width="4"/>
    <!-- feather marks on the head -->
    <path d="M196 244 L 228 256 M 186 280 L 222 288" fill="none" stroke-width="6"/>
  </g>
</svg>
